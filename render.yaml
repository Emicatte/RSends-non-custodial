# ═══════════════════════════════════════════════════════════════════════════
#  RSends Non-Custodial — Render Blueprint (Base Sepolia / testnet posture)
#
#  Reflects the REAL backend architecture:
#   • FastAPI web service — ALSO runs the on-chain PaymentMade indexer inside the
#     app lifespan (app/main.py → start_indexer_if_needed). => the web service MUST
#     stay at numInstances: 1. Scaling it would spawn N concurrent indexers all
#     doing eth_getLogs and writing the SAME rows. DO NOT autoscale this service.
#   • Celery worker — consumes the queues (notify = webhook delivery + intent
#     expiry + email; confirm/analytics/default). See app/celery_app.py.
#   • Celery beat — the 15s `process_webhook_deliveries` loop, 60s
#     `expire_pending_intents`, daily GDPR deletion cron. Beat MUST be a single
#     instance (duplicate beats = duplicate scheduled fires).
#   • Managed PostgreSQL (fresh — see ⚠️ below) + managed Redis (idempotency,
#     cache, Celery broker/result).
#
#  ⚠️ FRESH DATABASE: the dev DB carried a stale Classic alembic stamp (0038).
#     This Render Postgres starts EMPTY, so `alembic upgrade head` runs clean
#     0001 → 0004 (noncustodial baseline → settlement fee → reorg → reversal).
#     NEVER restore/point this at the old dev DB — the stale stamp would break
#     migrations. Empty DB only.
#
#  ⚠️ TESTNET GUARD POSTURE: backend config.py derives `is_prod` from
#     `(not DEBUG) or ENVIRONMENT startswith "prod"` — NOT from ENVIRONMENT alone.
#     To relax the prod-only guards (Redis must be rediss:// TLS, HMAC>=32,
#     AUTH_JWT>=64, OAuth required, …) for testnet you need BOTH
#     ENVIRONMENT=development AND DEBUG=true. ENVIRONMENT=development by itself
#     does NOT relax them. (ALCHEMY_API_KEY is ALWAYS required, prod or not.)
# ═══════════════════════════════════════════════════════════════════════════

databases:
  - name: rsends-db
    databaseName: rsends
    user: rsends
    plan: free          # testnet; bump to a paid plan for retention/perf
    region: frankfurt

services:
  # ── Redis (cache + idempotency + Celery broker/result) ───────────────────
  - type: redis
    name: rsends-redis
    plan: free
    region: frankfurt
    ipAllowList: []     # internal-only (no public access)
    maxmemoryPolicy: noeviction   # broker/idempotency must NOT silently evict

  # ── FastAPI web + in-process PaymentMade indexer (SINGLE INSTANCE) ───────
  - type: web
    name: rsends-api
    runtime: docker
    plan: starter       # always-on: free tier spins down → the indexer would pause
    region: frankfurt
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    numInstances: 1     # ⚠️ NEVER raise — indexer runs in the app lifespan
    healthCheckPath: /health     # NOT /health/sweep (removed); /health probes Redis
    preDeployCommand: "alembic upgrade head"   # runs once per deploy, pre-traffic
    envVars:
      - fromGroup: rsends-shared
      - key: PORT
        value: "8000"
      # entrypoint.sh skips its own boot migration because preDeployCommand owns it
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "0"

  # ── Celery worker (webhook delivery, intent expiry, email, deletions) ────
  - type: worker
    name: rsends-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: "celery -A app.celery_app:celery worker -l info -Q notify,confirm,analytics,default"
    envVars:
      - fromGroup: rsends-shared
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "0"      # worker never migrates

  # ── Celery beat (scheduler — SINGLE INSTANCE) ────────────────────────────
  - type: worker
    name: rsends-beat
    runtime: docker
    plan: starter
    region: frankfurt
    numInstances: 1     # ⚠️ exactly one beat, or schedules double-fire
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: "celery -A app.celery_app:celery beat -l info"
    envVars:
      - fromGroup: rsends-shared
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "0"

# ═══════════════════════════════════════════════════════════════════════════
#  Shared env group. Secrets with generateValue are created once by Render and
#  shared across web/worker/beat. Copy HMAC_SECRET and INTERNAL_PROXY_SECRET
#  into the Vercel frontend so the two sides match.
#
#  `sync: false` = Render will NOT auto-fill; you paste the value in the
#  dashboard. Used where the value needs a specific scheme/db-index Render's
#  auto-wiring can't express (see notes), or is an external secret.
# ═══════════════════════════════════════════════════════════════════════════
envVarGroups:
  - name: rsends-shared
    envVars:
      # Testnet posture (relaxes prod guards — see header)
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: "true"

      # ── Postgres ──
      # Render's Internal Database URL is `postgresql://…`. The app + alembic use
      # asyncpg ONLY (no psycopg2), so you MUST paste it with the +asyncpg driver:
      #   postgresql+asyncpg://USER:PASS@HOST:5432/rsends
      - key: DATABASE_URL
        sync: false

      # ── Redis ── paste the Render rsends-redis Internal URL, with db index:
      #   REDIS_URL              redis://…:6379/0
      #   CELERY_BROKER_URL      redis://…:6379/1
      #   CELERY_RESULT_BACKEND  redis://…:6379/2
      # (redis:// is fine because the testnet posture sets is_prod=false; a
      #  prod posture would require rediss:// TLS.)
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

      # ── Secrets (auto-generated, shared across services) ──
      - key: HMAC_SECRET                 # >=32 chars; copy to Vercel HMAC_SECRET
        generateValue: true
      - key: INTERNAL_PROXY_SECRET       # copy to Vercel INTERNAL_PROXY_SECRET
        generateValue: true
      - key: AUTH_JWT_SECRET             # session JWT signing
        generateValue: true

      # ── RPC / indexer (REQUIRED) ──
      - key: ALCHEMY_API_KEY             # ALWAYS required, even on testnet
        sync: false
      # {"84532":"0x<RSendsRouter>"} — FILL AFTER the contract deploy (Part 3)
      - key: RSENDS_ROUTER_ADDRESSES_JSON
        sync: false
      # {"84532":"https://base-sepolia.g.alchemy.com/v2/<KEY>"} (or public RPC)
      - key: INDEXER_RPC_URLS_JSON
        sync: false
      - key: INDEXER_CONFIRMATIONS
        value: "2"
      - key: INDEXER_USE_FINALIZED_TAG
        value: "true"

      # ── CORS / frontend wiring ──
      # Comma-separated; set to your Vercel domain, e.g. https://rsends.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # ── End-user auth + email (optional on testnet; fill to enable) ──
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_DEV_MODE
        value: "true"
      - key: APP_URL                     # public URL of the Vercel frontend
        sync: false
