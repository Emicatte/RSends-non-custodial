# ═══════════════════════════════════════════════════════════════════════════
#  RSends Non-Custodial — Render Blueprint (TRUE PRODUCTION posture)
#
#  Runs with ENVIRONMENT=production + DEBUG=false, so EVERY prod guard in
#  app/config.py is ACTIVE. We satisfy all of them rather than relax — see the
#  guard checklist at the bottom. (This blueprint targets Base Sepolia testnet
#  but keeps the full prod security posture; only non-security conveniences like
#  outbound email are toggled off.)
#
#  ── Architecture (verified against the code) ──
#   • FastAPI web service ALSO runs the on-chain PaymentMade indexer inside the
#     app lifespan (app/main.py → start_indexer_if_needed). ⇒ numInstances: 1,
#     ALWAYS-ON tier. Scaling it spawns N duplicate indexers; a spun-down free
#     instance stops detecting payments.
#   • Celery worker with EMBEDDED beat (--beat), single service for demo/low-scale:
#     queues notify (webhooks/expiry/email) / confirm / analytics / default, plus
#     the scheduler (15s process_webhook_deliveries, 60s expire_pending_intents,
#     daily GDPR deletion). ⚠️ numInstances MUST be 1 — a duplicate embedded beat
#     double-fires every schedule. For production: split worker + dedicated beat.
#   • Indexer cursor is persisted in REDIS (key indexer:last_block:{chain_id}).
#     A web restart resumes from the cursor (re-checks reorg depth) — no rescan
#     from zero. ⚠️ If Redis LOSES the key (eviction / wiped free instance), the
#     next start jumps to the current head and SKIPS the gap → missed payments.
#     ⇒ Redis needs persistence + noeviction (below). To backfill a gap, set
#     INDEXER_START_BLOCKS_JSON and restart.
#
#  ⚠️ FRESH DATABASE: Render Postgres starts empty → `alembic upgrade head` runs
#     clean 0001→0004. NEVER point this at the old dev DB (stale Classic stamp
#     0038). Alembic uses an ASYNC engine reading DATABASE_URL directly, so the
#     SAME postgresql+asyncpg:// URL works for migrations — no sync/psycopg2 URL.
# ═══════════════════════════════════════════════════════════════════════════

databases:
  - name: rsends-db
    databaseName: rsends
    user: rsends
    # Paid plan recommended: free Postgres expires after 30 days and has no
    # backups. Use at least the basic plan for any persistent testnet.
    plan: basic-256mb
    region: frankfurt

services:
  # ── Redis (cache + idempotency + Celery broker/result + INDEXER CURSOR) ──
  # ⚠️ The prod guard requires rediss:// (TLS), which Render Key Value only
  #    exposes on its EXTERNAL connection. So the URLs are set MANUALLY (sync:
  #    false) to the external rediss:// URL — NOT auto-wired via fromService
  #    (that would give the internal redis:// and fail the guard). This resource
  #    is the instance you connect to externally; see DEPLOY_RUNBOOK "Redis setup".
  - type: redis
    name: rsends-redis
    # ⚠️ PAID plan WITH PERSISTENCE: the indexer cursor lives here. A wiped Redis
    #    = a payment-detection gap (see header). Free plans do NOT persist.
    plan: standard
    region: frankfurt
    # ⚠️ Enable external access and allowlist your Render region's STATIC OUTBOUND
    #    IPs (Render dashboard → Connect → Outbound). Fill them here or in the
    #    dashboard. [] alone = internal-only (external rediss:// would be blocked).
    ipAllowList: []          # → add region outbound IPs (see runbook step 3)
    maxmemoryPolicy: noeviction

  # ── FastAPI web + in-process indexer (SINGLE INSTANCE, ALWAYS-ON) ───────
  - type: web
    name: rsends-api
    runtime: docker
    # ⚠️ ALWAYS-ON tier required (min: starter). Free web services spin down on
    #    idle → the lifespan indexer would stop detecting PaymentMade events.
    plan: starter
    region: frankfurt
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    numInstances: 1          # ⚠️ NEVER raise — indexer runs in the app lifespan
    healthCheckPath: /health # probes Redis; /health/sweep no longer exists
    preDeployCommand: "alembic upgrade head"   # async engine + asyncpg URL — OK
    envVars:
      - fromGroup: rsends-shared
      - key: PORT
        value: "8000"
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "0"           # preDeployCommand owns migrations

  # ── Celery worker + EMBEDDED beat (SINGLE INSTANCE, ALWAYS-ON) ──────────
  # Demo/low-scale: one service runs the worker AND the beat scheduler (--beat
  # reads celery.conf.beat_schedule from the same app: webhook 15s, expiry 60s,
  # GDPR daily). ⚠️ numInstances MUST stay 1 — a second instance = a second
  # embedded beat = duplicate scheduled fires. For production, split this back
  # into a dedicated worker + a separate single-instance beat (see DEPLOY_RUNBOOK).
  - type: worker
    name: rsends-worker
    runtime: docker
    plan: starter            # workers have no free tier; starter = min always-on
    region: frankfurt
    numInstances: 1          # ⚠️ exactly one — embedded beat must never duplicate
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    dockerCommand: "celery -A app.celery_app:celery worker --beat -l info -Q notify,confirm,analytics,default"
    envVars:
      - fromGroup: rsends-shared
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "0"

# ═══════════════════════════════════════════════════════════════════════════
#  Shared env group. `generateValue: true` = Render creates it once (shared).
#  `sync: false` = you paste it in the dashboard.
# ═══════════════════════════════════════════════════════════════════════════
envVarGroups:
  - name: rsends-shared
    envVars:
      # ── TRUE PROD posture (all guards active) ──
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WALLET_AUTH_ALLOW_LEGACY
        value: "false"       # prod guard: legacy replayable sigs forbidden

      # ── Postgres [guard: no rpagos:password@ default] ──
      # asyncpg ONLY (no psycopg2). Paste Render Internal URL with +asyncpg:
      #   postgresql+asyncpg://USER:PASS@HOST:5432/rsends
      - key: DATABASE_URL
        sync: false

      # ── Redis [guard: MUST be rediss:// TLS in prod] — MANUAL, not fromService ──
      # Set to the rsends-redis EXTERNAL rediss:// URL (with db index). Do NOT
      # auto-wire via fromService — that yields the internal redis:// and fails
      # the guard. See DEPLOY_RUNBOOK "Redis setup" (paid, noeviction, external
      # access + IP allowlist). Downgrading to redis:// is REJECTED at startup.
      #   REDIS_URL              rediss://…/0
      #   CELERY_BROKER_URL      rediss://…/1
      #   CELERY_RESULT_BACKEND  rediss://…/2
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

      # ── Secrets (prod guards) ──
      - key: HMAC_SECRET            # >=32 chars; copy to Vercel HMAC_SECRET
        generateValue: true
      - key: INTERNAL_PROXY_SECRET  # non-empty; copy to Vercel (same value)
        generateValue: true
      # ⚠️ AUTH_JWT_SECRET must be >=64 chars. Render generateValue may be
      #    shorter, so set it manually: python -c 'import secrets;print(secrets.token_hex(32))'
      - key: AUTH_JWT_SECRET
        sync: false

      # ── End-user auth [prod guard: GOOGLE_OAUTH_CLIENT_ID required] ──
      # Create a Google OAuth client (free; works on a vercel.app domain).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      # ── RPC / indexer (ALCHEMY_API_KEY always required) ──
      - key: ALCHEMY_API_KEY
        sync: false
      - key: RSENDS_ROUTER_ADDRESSES_JSON   # {"84532":"0x<router>"} — after Part 1
        sync: false
      - key: INDEXER_RPC_URLS_JSON          # {"84532":"https://base-sepolia.g.alchemy.com/v2/<KEY>"}
        sync: false
      - key: INDEXER_CONFIRMATIONS
        value: "2"
      - key: INDEXER_USE_FINALIZED_TAG
        value: "true"
      # Optional backfill if the Redis cursor was lost: {"84532":"<blockNumber>"}
      - key: INDEXER_START_BLOCKS_JSON
        sync: false

      # ── CORS / public URL [prod guard: APP_URL required & public] ──
      - key: CORS_ORIGINS                   # https://<your-app>.vercel.app
        sync: false
      - key: APP_URL                        # https://<your-app>.vercel.app
        sync: false

      # ── Email — non-security testnet convenience: sending OFF ──
      # EMAIL_DEV_MODE=true means no real email provider is required. APP_URL is
      # still mandatory (prod guard) and is set above. For real mainnet email,
      # set EMAIL_DEV_MODE=false and provide RESEND_API_KEY.
      - key: EMAIL_DEV_MODE
        value: "true"
