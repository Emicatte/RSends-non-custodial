name: CI

# M12 — lint/type/test gate. Runs the smart-contract suite, the backend
# audit-remediation regression tests, and the frontend type-check on every
# push/PR so drifts (like the H3 validate_settings change that silently broke
# test_config_hardening) are caught automatically.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vvv

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/backend
    # Redis is NOT optional in this system (fail-closed rate limiting, health
    # reports degraded without it) — the suite runs against a real Redis, same
    # as local and production. Plain redis:// is fine here: the rediss:// TLS
    # guard in config.py applies only when is_prod.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Postgres for the Alembic migration regression test (issue #17). The main
      # suite stays on SQLite (DATABASE_URL below); only tests/test_migrations_postgres.py
      # reads ALEMBIC_TEST_DATABASE_URL and runs the real chain against Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "sqlite+aiosqlite://"
      DEBUG: "true"
      ENVIRONMENT: "test"
      REDIS_URL: "redis://localhost:6379/0"
      ALEMBIC_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/rsends_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Unit tests (RPC-free; excludes e2e + integration)
        # The whole backend suite EXCEPT:
        #   - e2e        : needs a local Anvil node (separate e2e job)
        #   - integration: needs a live service / authenticated DB-backed context
        #                  (quarantined with documented reasons in the test files)
        # This includes the RPC-free token-registry invariants
        # (tests/test_registry_invariants.py) so every PR enforces:
        # EIP-55 checksums, enabled⇒verified, and the registry schema.
        run: pytest -q -m "not e2e and not integration"

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Type-check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Unit tests (jest)
        working-directory: apps/web
        run: npx jest --ci
      - name: Production build
        working-directory: apps/web
        run: npx next build

  e2e:
    name: E2E (Anvil money-path)
    runs-on: ubuntu-latest
    # The real suite runs in ~1min; a wedged anvil/forge with no timeout has
    # burned the full 6h GitHub ceiling. Cap it so a hang self-terminates.
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite://"
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - name: Build contracts
        working-directory: packages/contracts
        run: forge build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps + E2E deps
        working-directory: services/backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-e2e.txt
      - name: Run Anvil E2E (both branches + negative)
        run: make e2e-anvil
